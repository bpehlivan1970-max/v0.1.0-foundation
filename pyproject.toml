[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-foundation"
version = "0.1.0"
description = "Foundation layer for Claude-powered applications: streaming multi-turn chat with sane defaults."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-chat = "claude_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
